caption: 'A 30 × 40 ft basement takes about 48 yd³ of concrete, and over half of it
  is the walls.


  On the 137.3 ft centerline: footing 20 × 10 in = 7.06 yd³, walls 8 in × 8 ft = 27.13
  yd³, slab 4 in = 13.68 yd³. Total 47.88 yd³ (36.6 m³), walls 57%. Measure the outside
  instead of the centerline and you count every corner twice: +0.53 yd³.


  Do you take off foundations on the centerline or the outside face?


  Part 2 of 3. Follow for Part 3: how many trucks. Free concrete calculator — link
  in bio.'
