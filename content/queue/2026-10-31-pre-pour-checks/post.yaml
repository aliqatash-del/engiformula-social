- style: block
  title: 5 checks ==before the pour==
  body: Ten minutes, one tape, the drawings.
  cta: SWIPE →
  counter: 1 / 7
- title: 1. Cover
  body: Measure cover to the bars at several points against the drawings. Too little
    cover is the start of corrosion.
  counter: 2 / 7
- title: 2. Chairs and spacing
  body: Bars on chairs, not on the subgrade. Check spacing and laps against the bar
    schedule.
  counter: 3 / 7
- title: 3. Formwork
  body: Line, level and bracing. Clean out debris and standing water before the first
    bucket.
  counter: 4 / 7
- title: 4. Embeds and sleeves
  body: 'Anchor bolts, sleeves, conduits, waterstops: in place, fixed, and checked
    by the trades who need them.'
  counter: 5 / 7
- title: 5. The ticket
  body: Mix, **strength**, slump and time batched. Wrong mix on the ticket? Don't
    place it.
  counter: 6 / 7
