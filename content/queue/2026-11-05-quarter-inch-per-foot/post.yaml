caption: '1/4 in per foot is a 2.08% slope, not 2%. Small difference, until it''s
  200 ft of pipe.


  Percent slope = rise ÷ run × 100. 0.25 ÷ 12 × 100 = 2.08% (20.8 mm per m).

  Over 200 ft that''s 50 in of fall, not 48 in. Two inches you didn''t plan for.


  Which do you specify most: in/ft, % or 1:x?


  Save this. Free percent slope calculator — link in bio.'
