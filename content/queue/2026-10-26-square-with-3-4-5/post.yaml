caption: 'A 20 × 30 ft footing is square when the diagonal reads 36 ft 0-11/16 in.
  No total station needed.


  It''s Pythagoras: √(20² + 30²) = 36.06 ft. The 3-4-5 rule is the same idea with
  whole numbers.

  Scale it up for accuracy: 6-8-10, 9-12-15, 15-20-25 ft (or 3-4-5 m, 6-8-10 m).


  What''s the biggest layout you''ve squared with just a tape?


  Save this for your next setting-out day.'
