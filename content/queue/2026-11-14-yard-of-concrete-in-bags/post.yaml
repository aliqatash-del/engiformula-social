caption: 'One cubic yard of concrete is 45 bags of 80 lb mix.


  1 yd³ = 3 × 3 × 3 ft = 27 ft³. An 80 lb bag yields about 0.6 ft³ (check the bag),
  so 27 ÷ 0.6 = 45 bags, or 3,600 lb of dry mix to lift. 1 yd³ = 0.765 m³.


  At how many bags do you stop mixing and call a truck?


  Save this. Free concrete bag calculator — link in bio.'
