caption: 'Order 52 yards and you pay for a 2-yard truck. Order 50 and you might run
  short.


  The Part 2 basement is 47.88 yd³ net: +5% = 50.3, +10% = 52.7. At about 10 yd³ a
  truck (check your supplier), 52 is five full trucks plus a 2-yard short load, which
  usually costs extra; 50 is exactly five trucks with 4.4% spare. Each 10 yd³ truck
  carries about 20 tons (39,000–40,500 lb) and ASTM C94 asks for discharge within
  90 minutes, so space trucks to your pour rate. Pro move: call the last truck after
  you measure what is left.


  Do you hold the last truck or order it all up front?


  Part 3 of 3. Save the concrete series. Free concrete calculator — link in bio.'
