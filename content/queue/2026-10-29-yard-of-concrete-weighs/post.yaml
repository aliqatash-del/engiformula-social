caption: 'A cubic yard of concrete weighs about 4,000 lb. That''s 2 tons in every
  yard on the truck.


  Normal-weight concrete runs about 145–150 lb/ft³ (2,300–2,400 kg/m³).

  150 lb/ft³ × 27 ft³ = 4,050 lb. A 10 yd³ load is over 40,000 lb of concrete alone.


  What''s the heaviest pour you''ve been on?


