caption: 'Same column, same concrete. Change how the ends are held and it carries
  16× more.


  Euler: P = π²EI/(kL)², so capacity goes with 1/k². Flagpole k = 2.0 → 0.25×, pinned
  1×, fixed–pinned 0.7 → 2×, fixed–fixed 0.5 → 4×. With the recommended design values
  (2.1 and 0.65, AISC 360-22 Commentary Table C-A-7.1) the gap is still about 10×.
  A pinned 3 m, 300 mm (12 in) column has slenderness 3000 / 86.6 = 35.


  Which end condition do you assume for a precast column?


  Part 1 of 3. Follow for Part 2: the moment that is not on the drawing.'
