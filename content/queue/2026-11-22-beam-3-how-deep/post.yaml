caption: 'A 6 m beam needs about 375 mm of depth, and one ratio gets you there.


  ACI 318-19 Table 9.3.1.1 minimum depth: simply supported L/16 = 375 mm (14.8 in),
  one end continuous L/18.5, both ends continuous L/21, cantilever L/8 = 750 mm. Eurocode
  2 (EN 1992-1-1:2004 Table 7.4N) asks how much steel you used: L/d 14 for heavily
  reinforced, 20 for lightly, so d = 300–429 mm, and only 0.4 of that for a cantilever.


  Do you start sizing beams from span/depth or from the moment?


  Part 3 of 3. Save the beam series and rewatch from Part 1.'
