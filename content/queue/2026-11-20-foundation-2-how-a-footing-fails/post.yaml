caption: 'A footing can pass bearing and still fail: the column punches through it
  like a cookie cutter.


  Three checks: bending at the column face, one-way shear at d from the face, and
  two-way (punching) shear on a perimeter d/2 from the face (ACI 318-19 §22.5 and
  §22.6). Our 4''-6" footing, 12 in thick, d = 8.5 in, 3,000 psi, under an assumed
  60 kip factored load: b0 = 82 in, φVc = 114 kips (509 kN) vs Vu = 51 kips (229 kN),
  45% used. At 10 in thick it is 67%.


  Which check governs your footings most often?


  Part 2 of 3. Follow for Part 3: the steel in a footing.'
