caption: 'This column presses on the ground 20× harder than the soil can take.


  40 kips (178 kN) on a 12 × 12 in column base is 40,000 psf. Sand allows about 2,000 psf (IBC
  2021 Table 1806.2 presumptive value), so you need 20 ft²: a 4''-6" square footing (1.37 m).
  On clay at 1,500 psf it grows to 5''-2"; on gravel at 3,000 psf, 3''-8" is enough.


  What bearing value do you usually see on your soil reports?


  Part 1 of 3. Follow for Part 2: how a footing actually fails. Free footing calculator — link
  in bio.'
