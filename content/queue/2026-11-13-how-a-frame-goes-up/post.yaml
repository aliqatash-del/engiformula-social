caption: 'Six stages take a frame from bare ground to a roof.


  Excavate, footings, columns, slab, next level, roof. Each stage waits on the one
  before it, so one late pour pushes everything after it. Simplified sequence; every
  job has its own programme.


  Which stage runs late most often on your jobs?


  Comment below and send this to your site team.'
