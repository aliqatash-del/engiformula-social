caption: '1/4 in per foot is a 2.08% slope, not 2%. Small difference, until it''s
  200 ft of pipe or paving.


  Percent slope = rise ÷ run × 100. 0.25 in ÷ 12 in = 2.08% (20.8 mm per m).

  Common ones: 1/8 in/ft = 1.04%, 1/2 in/ft = 4.17%, and a 1:12 ramp = 8.33%.


  Which slope do you specify most: in/ft, %, or 1:x?


  Save this cheat sheet. Free slope calculator — link in bio.'
