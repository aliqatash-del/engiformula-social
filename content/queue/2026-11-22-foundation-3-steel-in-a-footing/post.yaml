caption: 'The math says this footing needs 0.59 in² of steel. The code minimum says double.


  Soil pushes up and the column holds it down, so the footing is a cantilever off the column
  face with tension at the bottom. Mu = 2.963 ksf × 4.5 ft × 1.75² / 2 = 20.4 kip-ft (27.7 kN·m)
  → 0.59 in² (383 mm²). The Grade 60 minimum, 0.0018 × 54 × 12 = 1.17 in² (752 mm²), governs:
  6 #4 each way, about 9½ in apart. Keep 3 in of cover cast against earth (ACI 318-19 Table
  20.5.1.3.1; 75 mm in Eurocode 2).


  What do your crews use to hold the mat at 3 in?


  Part 3 of 3. Save the foundation series. Free footing calculator — link in bio.'
