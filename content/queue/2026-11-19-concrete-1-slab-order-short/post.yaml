caption: 'A 20 × 20 ft slab at 4 in is 4.94 yd³. Forget the thickened edge and you
  are short almost 2 yards.


  20 × 20 × 4/12 = 133.3 ft³ = 4.94 yd³ (3.78 m³). A 12 in wide edge, 8 in deeper,
  around the 76 ft centerline adds 50.7 ft³ = 1.88 yd³ (+38%). Half an inch low on
  the subgrade adds another 12.5%. Total 6.81 yd³; with 10% waste, order 7.5 yd³.


  What waste factor do you add for slabs on grade?


  Part 1 of 3. Follow for Part 2: a whole basement in yards. Free concrete calculator
  — link in bio.'
