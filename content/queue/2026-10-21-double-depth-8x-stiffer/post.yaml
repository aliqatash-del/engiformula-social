caption: 'Double the depth of a beam and it gets 8 times stiffer. Double the width
  and you only get 2 times.


  For a rectangle, I = b·h³/12. Depth is cubed, width isn''t.

  A 2×12 joist on edge (1.5 × 11.25 in) has I = 178 in⁴. Laid flat: 3.2 in⁴. Same
  wood, 56 times less stiff.


  Where have you seen a member installed the weak way round?


  Send this to someone who still thinks "bigger is bigger".'
