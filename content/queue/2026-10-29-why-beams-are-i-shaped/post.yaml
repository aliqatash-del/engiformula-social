caption: 'Same steel, 17 times stiffer. That''s why beams are I-shaped.


  8.1 in² of steel (27.6 lb/ft) as a solid 2.85 in square: I = 5.5 in⁴.

  The same area as an 8 in deep I-section (6 × 0.5 in flanges, 0.3 in web): I = 93.1
  in⁴.


  What''s the most over-sized member you''ve seen on a job?


  Send this to someone starting structural analysis.'
