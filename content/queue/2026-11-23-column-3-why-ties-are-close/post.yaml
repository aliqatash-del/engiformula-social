caption: 'Column bars do not snap. They buckle out sideways, and ties are what stop them.


  ACI 318-19 25.7.2.1: tie spacing is the least of 16 bar diameters, 48 tie diameters and the
  least column side → 12 in for #8 bars in a 12 in column. EN 1992-1-1 9.5.3: least of 20φ,
  b and 400 mm → 300 mm for 16 mm bars in a 300 mm column, × 0.6 = 180 mm near beams, slabs
  and laps. Total steel: 1–8% in ACI (10.6.1.1), max 4% outside laps in EC2; 4H16 in 300 × 300
  is 0.89%.


  Where do you see tie spacing go wrong on site?


  Part 3 of 3. Save the column series and rewatch from Part 1.'
