caption: 'This column has zero moment on the drawing. It still gets designed for 20
  kN·m.


  No column is straight: EC2 5.2(9) allows an imperfection of l0/400, 7.5 mm on 3
  m, so 1,000 kN (225 kips) already gives 7.5 kN·m. P-delta grows it by 1/(1 − N/Ncr):
  1.33× at 25% of the buckling load, 2× at 50%, 5× at 80%. So codes set a floor: EC2
  6.1(4) e0 = max(h/30, 20 mm) → 20 kN·m (14.8 kip-ft); ACI 318-19 6.6.4.5.4 uses
  0.6 + 0.03h in → 0.96 in for a 12 in column.


  Do you check minimum eccentricity by hand or trust the software?


  Part 2 of 3. Follow for Part 3: why ties are so close.'
