alt_text: Animation of a column under 1,000 kN. A drawing says the moment is zero,
  then a stamp says design moment 20 kN·m. The column bows by its 7.5 mm imperfection,
  a feedback loop of load, bend, offset and moment spins, bars show the moment growing
  1.33, 2 and 5 times, and the Eurocode and ACI minimum eccentricity rules appear.
