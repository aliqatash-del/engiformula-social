caption: 'A 12 × 20 ft slab, 4 in thick, needs 2.96 yd³ of concrete (2.27 m³). Here''s
  the 20-second method.


  12 ft × 20 ft × (4/12) ft = 80 ft³. Divide by 27 = 2.96 yd³.

  Most crews order 5–10% extra for subgrade and form variation (typical practice):
  3.1–3.3 yd³.


  How much extra do you order on a slab like this?


