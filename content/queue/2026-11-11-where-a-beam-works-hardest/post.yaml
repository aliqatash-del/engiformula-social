caption: 'A 6 m beam carrying 20 kN/m works hardest at mid-span: 90 kN·m.


  For a simply supported beam with a uniform load, M = wL²/8 = 20 × 6² / 8 = 90 kN·m
  (66.4 kip·ft). The moment is zero at the supports and peaks in the middle, which
  is why typical practice keeps bottom-bar splices away from mid-span.


  Where do you lap your bottom bars on a simple span?


  Save this. Free calculators with worked examples — link in bio.'
