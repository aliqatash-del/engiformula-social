caption: 'Those little holes at the bottom of a retaining wall are doing a big job.


  Rain soaks the soil behind the wall. If the water cannot get out, it pushes on the
  wall on top of the soil load. A drainage layer behind the wall and a row of weep
  holes let it out, so the wall only has to hold back the soil. Typical practice;
  the drainage detail is set by your design.


  Have you seen a wall with blocked or missing weep holes?


  Send this to your site team.'
