caption: 'A 12 in round pier, 4 ft deep, takes 6 bags of 80 lb concrete mix.


  π × 0.5² × 4 = 3.14 ft³ (0.089 m³).

  An 80 lb bag yields about 0.6 ft³, so 3.14 ÷ 0.6 = 5.2. Round up: 6 bags.


  How many piers is your next deck sitting on?


