caption: 'A contour map is the ground in 3D, drawn flat.


  Each line joins points at one level, here every 2 m. Lines close together mean steep
  ground; lines far apart mean gentle ground. Cut a section across them and the ground
  profile falls straight out.


  Which do you read faster: a contour plan or a section?


  Save this for your next site plan. Free percent slope calculator — link in bio.'
