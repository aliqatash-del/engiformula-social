caption: 'Make a column twice as tall and it carries a quarter of the load.


  Euler: P = π²EI / (KL)². Length is squared, so 2L gives 1 / 2² = 0.25 of the buckling
  load. Same section, same material. Design codes then cut this further for real-world
  imperfections.


  What is the most slender column you have had to brace on site?


  Send this to someone sizing columns this week. Free calculators — link in bio.'
