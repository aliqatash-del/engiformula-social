  #5: 1.043 lb/ft (1.552 kg/m), 15.9 mm diameter.

  16 mm: 1.578 kg/m (1.060 lb/ft). About 1.7% heavier, or 17 lb more per 1,000 ft.


  Did you guess right? Be honest.


  Save this for the next mixed-units job. Free rebar weight calculator — link in bio.'
