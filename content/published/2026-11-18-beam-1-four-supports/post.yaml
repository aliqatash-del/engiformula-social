alt_text: Animation of one 6 metre beam under 10 kN per metre. With pinned supports
  the bending moment peaks at 45 kN·m; with both ends fixed it is 30 at the supports
  and 15 mid-span; as a cantilever it is 180. A bar chart shows the cantilever deflects
  48 times the fixed beam.
