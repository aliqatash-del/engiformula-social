caption: 'Same 6 m beam, same load. The supports alone move the bending moment from
  30 to 180 kN·m.


  10 kN/m on 6 m (0.685 kip/ft on 19.7 ft): simply supported wL²/8 = 45 kN·m (33.2
  kip-ft). Fix both ends and it drops to 30 at the supports and 15 at mid-span. Make
  it a cantilever and it jumps to wL²/2 = 180 kN·m (132.8 kip-ft), and the tip sags
  48× more than the fixed beam.


  Which support condition do you trust least on site?


  Part 1 of 3. Follow for Part 2: where the steel goes. Free beam calculators — link
  in bio.'
