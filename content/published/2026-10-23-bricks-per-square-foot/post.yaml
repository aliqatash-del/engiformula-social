caption: 'A US modular brick wall takes 6.75 bricks per ft². A UK wall takes 59 per
  m². Same idea, different brick.


  US modular with 3/8 in joints: 8 × 2⅔ in per brick → 144 ÷ 21.33 = 6.75 per ft²
  (72.7 per m²).

  UK 215 × 65 mm with 10 mm joints: 225 × 75 mm → 59.3 per m² (5.5 per ft²).


  US or UK brick on your current job?


  Save this for your next masonry takeoff. Free brick calculator — link in bio.'
