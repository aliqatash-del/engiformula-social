caption: 'A 1% slope drops 1 ft for every 100 ft of pipe.


  1% = 0.01 × 100 ft = 1 ft of fall. Per foot, that is 12 in ÷ 100 = 0.12 in, so about
  1/8 in per ft (10 mm per metre). The required slope for a pipe depends on its size
  and your local code.


  What slope do you most often set for a 4 in drain?


  Save this. Free slope and pipe calculators — link in bio.'
