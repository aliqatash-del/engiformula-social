caption: 'Concrete is about 10× weaker in tension than in compression, so the steel
  goes wherever the beam stretches.


  C30/37: fctm 2.9 MPa vs fck 30 MPa (EN 1992-1-1 Table 3.1). Simply supported: bottom
  bars at mid-span. Fixed ends: top bars over the supports, running past where the
  moment changes sign at 0.21L. Near the supports, 45° shear cracks need stirrups
  packed closer. For 45 kN·m with d = 450 mm: As = M / (fyd × 0.9d) = 256 mm² → 3H12
  (339 mm²); in US bars, 2 #4 = 0.40 in².


  Where do you see bars cut off too early most often?


  Part 2 of 3. Follow for Part 3: how deep should a beam be?'
