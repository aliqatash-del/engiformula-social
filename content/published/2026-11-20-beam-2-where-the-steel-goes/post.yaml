alt_text: Animation of a see-through concrete beam. The tension zone glows orange
  at the bottom of a simply supported beam and at the top over the supports of a fixed
  beam. Cracks open, bottom and top bars slide in, 45 degree shear cracks appear and
  stirrups are added, closer near the supports. The working gives 256 square millimetres,
  so 3 bars of 12 mm.
