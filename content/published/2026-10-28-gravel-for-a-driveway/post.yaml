caption: 'A 12 × 40 ft driveway, 4 in of gravel: 5.9 yd³, about 8.3 tons.


  12 × 40 × 4/12 = 160 ft³ ÷ 27 = 5.93 yd³ (4.53 m³).

  Crushed stone is often taken as about 1.4 tons per yd³ (typical; ask your supplier):
  8.3 tons, or 7.7–8.9 tons across 1.3–1.5.


  Do you order gravel by the ton or by the yard where you work?


