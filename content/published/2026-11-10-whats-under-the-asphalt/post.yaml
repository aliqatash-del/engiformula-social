caption: 'Only the top 3 in of a typical road is asphalt.


  A common build-up: 3 in (76 mm) asphalt, 8 in (203 mm) crushed-stone base and 12
  in (305 mm) granular subbase on compacted subgrade. That is 23 in (584 mm) of pavement,
  and 20 in of it is stone. Typical practice only; your design governs.


  What base thickness do you see most on driveways in your area?


  Save this. Free asphalt and road base calculators — link in bio.'
