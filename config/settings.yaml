# EngiFormula social automation — main settings
# Times are stored with offsets; the scheduler compares in UTC.

timezone: Asia/Riyadh          # owner's time zone (approvals + reminders)
graph_api_version: v24.0       # Meta Graph API version; update when Meta deprecates it

slots:                         # daily publishing slots, in the owner's time zone (winter time)
  A: "15:00"                   # 12:00 London  / 07:00 New York — UK audience, carousels
  B: "20:00"                   # 17:00 London  / 12:00 New York — US audience, Reels

approval:
  send_batch_days_ahead: 2     # posts within this window are sent to Telegram for approval (owner: one week at a time is confusing)
  reminder_daily_at: "09:00"   # daily reminder for anything still pending
  final_reminder_hours: 2      # last reminder this many hours before the slot
  late_publish_hours: 24       # approved after its slot? it still goes out on the next run, up to this many hours late
  tap_alert_hours: 24          # warn in the daily message if posts wait for approval and no tap has arrived for this long
  never_autopublish: true      # unapproved posts are skipped, never published

limits:                        # enforced by validate.py before anything is sent for approval
  instagram_max_hashtags: 5
  instagram_caption_max_chars: 2200
  instagram_carousel_max_items: 10
  facebook_reel_max_seconds: 90
  instagram_reel_max_seconds: 900
  image_max_mb: 8

voice:                         # Reel voiceover (scripts/voiceover.py, Kokoro TTS — runs in build-reels.yml)
  name: am_michael             # Kokoro voice: am_michael (US male); alternatives am_fenrir, am_puck, af_heart (US female)
  lang_code: a                 # a = American English, b = British English (use a b* voice, e.g. bm_george)
  speed: 1.0                   # 0.9 slower … 1.1 faster
  lead_seconds: 0.1            # silence before each slide's line
  pad_seconds: 0.35            # silence after it before the next frame
  caption_words: 3             # words per burned-in caption chunk
  max_seconds: 60              # warn if the reel runs longer

brand:
  handle_instagram: "@engiformula"
  website: "engiformula.com"
  signature_hashtag: "#engiformula"
