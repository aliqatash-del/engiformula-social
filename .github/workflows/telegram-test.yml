name: Telegram bot check (README step 5)

on:
  workflow_dispatch:
    inputs:
      job: { description: "whoami (print your chat id) | test (send the test message) | updates (show waiting taps)", default: "test" }

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - name: Run telegram.py ${{ github.event.inputs.job }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/telegram.py ${{ contains(fromJSON('["whoami","updates"]'), github.event.inputs.job) && github.event.inputs.job || 'test' }}
